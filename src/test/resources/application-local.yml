# 테스트 전용. main 의 application-local.yml 을 가리므로 필요한 값을 여기에 다시 적음
spring:
  datasource:
    url: jdbc:h2:mem:cafe-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: test-only-secret-0123456789-0123456789-abcdef
  staff:
    username: staff
    password: staff1234
  storage:
    # 사진을 build 아래로 돌려 작업 폴더를 더럽히지 않음
    local-path: ./build/test-images
