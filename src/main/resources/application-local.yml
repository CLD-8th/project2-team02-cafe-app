# 내 PC. 주문 · 회원 · 메뉴는 H2 메모리 DB, 사진은 디스크. MySQL · AWS 가 전혀 필요 없음.
# 앱을 끄면 DB 내용은 사라짐 — 직원 계정 · 기본 메뉴는 뜰 때마다 다시 만들어짐.
spring:
  datasource:
    url: jdbc:h2:mem:cafe;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    # 내 PC 전용 테스트 키. prod 는 JWT_SECRET 환경 변수로만 받음
    secret: local-only-test-secret-change-me-0123456789
  staff:
    # 내 PC 전용 테스트 직원 계정
    username: staff
    password: staff1234
  storage:
    local-path: ./data/menu-images

logging:
  level:
    com.example.cafe: debug

management:
  endpoint:
    health:
      show-details: always
