<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cafe · v2</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>cafe</h1>
    <div class="header-right">
      <span id="who" class="who"></span>
      <button id="logout" class="small hidden" type="button">로그아웃</button>
      <span id="version" class="version">버전 확인 중</span>
    </div>
  </header>

  <main>
    <p id="message" class="message"></p>

    <!-- 로그인 · 가입 -->
    <section id="auth-view" class="card hidden">
      <h2>로그인</h2>
      <form id="auth-form">
        <input id="username" placeholder="아이디 (영문 소문자·숫자·_ 4~20자)" autocomplete="username" required>
        <input id="password" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password" required>
        <button type="submit" id="login-btn">로그인</button>
        <button type="button" id="signup-btn" class="secondary">회원가입</button>
      </form>
      <p class="hint">회원가입하면 손님 계정이 됨. 직원 계정은 관리자가 따로 만듦. 실제 개인정보는 넣지 말 것.</p>
    </section>

    <!-- 손님 -->
    <section id="customer-view" class="hidden">
      <div class="card">
        <h2>메뉴</h2>
        <div id="menu-grid" class="menu-grid"></div>
      </div>
      <div class="card">
        <h2>내 주문 <button class="small refresh" type="button">새로 고침</button></h2>
        <table>
          <thead><tr><th>번호</th><th>메뉴</th><th>수량</th><th>금액</th><th>상태</th><th>주문 시각</th><th></th></tr></thead>
          <tbody id="my-orders"></tbody>
        </table>
        <p class="hint">접수 상태일 때만 취소할 수 있음. 5초마다 자동 새로 고침.</p>
      </div>
    </section>

    <!-- 직원 -->
    <section id="staff-view" class="hidden">
      <div class="card">
        <h2>주문 관리 <button class="small refresh" type="button">새로 고침</button></h2>
        <div id="filters" class="filters">
          <button type="button" data-status="" class="filter active">전체</button>
          <button type="button" data-status="RECEIVED" class="filter">접수</button>
          <button type="button" data-status="PREPARING" class="filter">제조 중</button>
          <button type="button" data-status="COMPLETED" class="filter">완료</button>
          <button type="button" data-status="CANCELED" class="filter">취소</button>
        </div>
        <table>
          <thead><tr><th>번호</th><th>손님</th><th>메뉴</th><th>수량</th><th>금액</th><th>상태</th><th>주문 시각</th><th></th></tr></thead>
          <tbody id="staff-orders"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>메뉴 관리</h2>
        <form id="menu-form">
          <input id="menu-name" placeholder="메뉴 이름" maxlength="30" required>
          <input id="menu-price" type="number" min="100" max="100000" step="100" placeholder="가격" required>
          <button type="submit">메뉴 추가</button>
        </form>
        <table>
          <thead><tr><th>사진</th><th>이름</th><th>가격</th><th>판매</th><th></th></tr></thead>
          <tbody id="staff-menus"></tbody>
        </table>
        <p class="hint">사진은 jpg · png · webp, 2MB 이하. 판매 중지한 메뉴는 손님 화면에서 사라지고 지난 주문은 그대로 남음.</p>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
